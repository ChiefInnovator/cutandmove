name: Prepare release marketing patch
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-marketing
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read latest published stable release
        run: gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json"
      - name: Update full versions and download links
        run: python3 scripts/sync-release.py "$RUNNER_TEMP/release.json"
      - name: Verify generated content
        run: |
          python3 scripts/sync-marketing.py --check
          python3 scripts/test-marketing.py
          python3 scripts/test-release-sync.py
          node scripts/test-share.cjs
          git diff --check
      - name: Prepare reviewable patch
        id: patch
        run: |
          mkdir -p "$RUNNER_TEMP/release-marketing"
          git diff --binary -- marketing.json index.html README.md llms.txt > "$RUNNER_TEMP/release-marketing/release-marketing.patch"
          if test -s "$RUNNER_TEMP/release-marketing/release-marketing.patch"; then
            git rev-parse HEAD > "$RUNNER_TEMP/release-marketing/base-sha.txt"
            cp "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release-marketing/release.json"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Download the release-marketing artifact and apply it through feature/* → develop → main. See docs/marketing.md. Nothing has been deployed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Published release marketing is already current; no patch is needed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload release patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-marketing
          path: ${{ runner.temp }}/release-marketing/
          retention-days: 7
          if-no-files-found: error
