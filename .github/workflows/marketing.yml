name: Marketing consistency
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-marketing.py --check
      - run: python3 scripts/test-marketing.py
      - run: node scripts/test-share.cjs
