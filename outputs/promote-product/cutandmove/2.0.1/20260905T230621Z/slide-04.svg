<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><g font-family="Arial"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#101828"/><rect x="76" y="90" width="46" height="6" rx="0" fill="#ffad75"/><text x="76" y="143.0" font-size="25" font-weight="bold" fill="#bdcbdf">INVENTING FIRE WITH AI</text><text x="76" y="247.0" font-size="25" font-weight="bold" fill="#ffad75">KEYBOARD + MOUSE</text><text x="76" y="357" font-size="69" font-weight="bold" fill="#f7f9fc">Two ways.</text><text x="76" y="450" font-size="69" font-weight="bold" fill="#f7f9fc">One cut selection.</text><text x="76" y="558" font-size="34" font-weight="normal" fill="#bdcbdf">Start with a shortcut. Finish with a click.</text><text x="76" y="606" font-size="34" font-weight="normal" fill="#bdcbdf">Or switch the order.</text><text x="76" y="694.0" font-size="24" font-weight="bold" fill="#ffad75">KEYBOARD → FINDER MENU</text><rect x="76" y="729" width="377" height="120" rx="18" fill="#243c5c"/><rect x="598" y="729" width="406" height="120" rx="18" fill="#243c5c"/><text x="108" y="807.0" font-size="45" font-weight="bold" fill="#f7f9fc">Cmd+X</text><text x="628" y="807.0" font-size="45" font-weight="bold" fill="#f7f9fc">Move Here</text><text x="490" y="814.0" font-size="76" font-weight="bold" fill="#ffad75">→</text><text x="76" y="900.0" font-size="24" font-weight="bold" fill="#ffad75">FINDER MENU → KEYBOARD</text><rect x="76" y="935" width="377" height="120" rx="18" fill="#243c5c"/><rect x="598" y="935" width="406" height="120" rx="18" fill="#243c5c"/><text x="108" y="1013.0" font-size="45" font-weight="bold" fill="#f7f9fc">Menu Cut</text><text x="628" y="1013.0" font-size="45" font-weight="bold" fill="#f7f9fc">Cmd+V</text><text x="490" y="1020.0" font-size="76" font-weight="bold" fill="#ffad75">→</text><text x="76" y="1177.0" font-size="27" font-weight="normal" fill="#bdcbdf">Keyboard shortcuts require Accessibility access.</text><path d="M76 1220 H1004" stroke="#bdcbdf" stroke-opacity="0.4"/><text x="76" y="1272.0" font-size="24" font-weight="normal" fill="#ffad75">@richcrane</text><text x="393" y="1272.0" font-size="24" font-weight="normal" fill="#bdcbdf">Cut &amp; Move v2.0.1</text><text x="904" y="1272.0" font-size="24" font-weight="normal" fill="#bdcbdf">04 / 06</text></g></svg>