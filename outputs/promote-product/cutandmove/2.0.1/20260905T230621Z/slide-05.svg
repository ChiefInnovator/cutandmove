<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><g font-family="Arial"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#f7f9fc"/><rect x="76" y="90" width="46" height="6" rx="0" fill="#ae470b"/><text x="76" y="143.0" font-size="25" font-weight="bold" fill="#48576b">INVENTING FIRE WITH AI</text><text x="76" y="247.0" font-size="25" font-weight="bold" fill="#ae470b">NO FOLDER SETUP</text><text x="76" y="357" font-size="78" font-weight="bold" fill="#101828">Local folders.</text><text x="76" y="450" font-size="78" font-weight="bold" fill="#101828">Mounted drives.</text><text x="76" y="558" font-size="34" font-weight="normal" fill="#48576b">Enable the Finder extension once.</text><text x="76" y="606" font-size="34" font-weight="normal" fill="#48576b">Folder coverage is automatic.</text><rect x="76" y="690" width="928" height="356" rx="25" fill="#e6edf6"/><text x="110" y="778" font-size="56" font-weight="bold" fill="#101828">No folder picker.</text><text x="110" y="853" font-size="56" font-weight="bold" fill="#101828">No allowlist.</text><text x="110" y="951" font-size="31" font-weight="normal" fill="#48576b">Menu moves reject existing destinations</text><text x="110" y="997" font-size="31" font-weight="normal" fill="#48576b">and changed sources.</text><text x="76" y="1095.0" font-size="27" font-weight="normal" fill="#48576b">Virtual Finder views may not expose a destination.</text><text x="76" y="1177.0" font-size="25" font-weight="normal" fill="#48576b">Protected and read-only locations still obey macOS permissions.</text><path d="M76 1220 H1004" stroke="#48576b" stroke-opacity="0.4"/><text x="76" y="1272.0" font-size="24" font-weight="normal" fill="#ae470b">@richcrane</text><text x="393" y="1272.0" font-size="24" font-weight="normal" fill="#48576b">Cut &amp; Move v2.0.1</text><text x="904" y="1272.0" font-size="24" font-weight="normal" fill="#48576b">05 / 06</text></g></svg>